<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll-Video Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0b0b; font-family:sans-serif; color:#fff; }

  .scroll-stage {
    height: 400vh; /* <- Scroll-Länge: größer = feiner/langsamer scrubbbar */
    position: relative;
  }

  .sticky-wrap {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 4px;
    background: #ffffff;
    z-index: 10;
  }

  .hint {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.6;
    z-index: 10;
  }

  .spacer {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    opacity: 0.5;
  }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-size: 16px;
    z-index: 20;
  }
</style>
</head>
<body>

<div class="loading" id="loading">Lade Frames... 0%</div>
<div class="progress-bar" id="progressBar"></div>
<div class="hint">Scrolle nach unten &darr; / nach oben &uarr;</div>

<div class="spacer">Nach unten scrollen, um das Video zu starten</div>

<div class="scroll-stage" id="scrollStage">
  <div class="sticky-wrap">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="spacer">Ende der Sequenz</div>

<script>
/* ==========================================================================
   SCROLL-SCRUBBING mit vielen (interpolierten) Frame-Bildern
   --------------------------------------------------------------------------
   Vorher im Terminal, im selben Ordner wie 1.mkv:

     mkdir frames
     ffmpeg -i 1.mkv -filter:v "minterpolate=fps=120:mi_mode=mci:mc_mode=aobmc:vsbmc=1" frames/frame_%04d.jpg

   -> erzeugt 120 Frames pro Sekunde Videolänge, auch wenn das Original
      viel weniger fps hatte (ffmpeg berechnet Zwischenbilder).
      Für noch mehr Frames: fps=120 z.B. auf 240 erhöhen.

   Danach zeigt ffmpeg in der letzten Zeile an, wie viele Frames erzeugt
   wurden (z.B. "frame= 480"). Diese Zahl unten bei FRAME_COUNT eintragen.
   ========================================================================== */

// ---- KONFIGURATION ----
const FRAME_COUNT = 480;               // <- ANPASSEN: tatsächliche Anzahl erzeugter Dateien
const FRAME_PATH  = i => `frames/frame_${String(i).padStart(4,'0')}.jpg`;

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const scrollStage = document.getElementById('scrollStage');
const progressBar = document.getElementById('progressBar');
const loading = document.getElementById('loading');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const images = new Array(FRAME_COUNT);
let settledCount = 0; // erfolgreich ODER fehlgeschlagen geladen
let errorCount = 0;

function checkAllSettled() {
  settledCount++;
  loading.textContent = `Lade Frames... ${Math.round(settledCount / FRAME_COUNT * 100)}%`;
  if (settledCount === FRAME_COUNT) {
    if (errorCount > 0) {
      loading.innerHTML = `${errorCount} von ${FRAME_COUNT} Frames konnten nicht geladen werden.<br>Liegt der komplette "frames"-Ordner im Repo? Details in der Konsole (F12).`;
      loading.style.fontSize = '14px';
      loading.style.padding = '2rem';
      loading.style.textAlign = 'center';
      // Seite trotzdem nutzbar machen, falls zumindest ein Teil geladen ist
      if (errorCount < FRAME_COUNT) {
        setTimeout(() => { loading.remove(); }, 4000);
      }
    } else {
      loading.remove();
    }
    drawFrame(0);
    updateFrameFromScroll();
  }
}

function loadRealFrames() {
  for (let i = 0; i < FRAME_COUNT; i++) {
    const img = new Image();
    img.src = FRAME_PATH(i + 1); // frame_0001.jpg = erstes Bild
    img.onload = checkAllSettled;
    img.onerror = () => {
      errorCount++;
      console.error('Frame konnte nicht geladen werden:', img.src);
      checkAllSettled();
    };
    images[i] = img;
  }
}

function drawFrame(index) {
  index = Math.max(0, Math.min(FRAME_COUNT - 1, index));
  const img = images[index];
  if (!img || !img.complete || img.naturalWidth === 0) return;

  const canvasRatio = canvas.width / canvas.height;
  const imgRatio = img.width / img.height;
  let sx, sy, sw, sh;
  if (imgRatio > canvasRatio) {
    sh = img.height;
    sw = sh * canvasRatio;
    sx = (img.width - sw) / 2;
    sy = 0;
  } else {
    sw = img.width;
    sh = sw / canvasRatio;
    sx = 0;
    sy = (img.height - sh) / 2;
  }
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
}

let ticking = false;

function onScroll() {
  if (!ticking) {
    requestAnimationFrame(updateFrameFromScroll);
    ticking = true;
  }
}

function updateFrameFromScroll() {
  const rect = scrollStage.getBoundingClientRect();
  const stageHeight = scrollStage.offsetHeight - window.innerHeight;
  let progress = -rect.top / stageHeight;
  progress = Math.max(0, Math.min(1, progress));

  const frameIndex = Math.round(progress * (FRAME_COUNT - 1));
  drawFrame(frameIndex);

  progressBar.style.width = (progress * 100) + '%';
  ticking = false;
}

window.addEventListener('scroll', onScroll, { passive: true });

loadRealFrames();
</script>

</body>
</html>
