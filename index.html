<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll Video Scrub</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, sans-serif;
    background: #111;
    color: #eee;
  }

  /* Dieser Container gibt dem Scroll "Platz" — je größer die Höhe,
     desto langsamer/länger dauert das Durchscrubben des Videos. */
  .scroll-stage {
    height: 400vh; /* -> auf 300vh/500vh etc. anpassen für schneller/langsamer */
    position: relative;
  }

  /* Das Video bleibt fix im Viewport stehen, während man scrollt */
  .video-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    width: 100%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }

  #scrub-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .info {
    position: fixed;
    bottom: 20px;
    left: 20px;
    font-size: 13px;
    opacity: 0.6;
    z-index: 10;
  }

  .filler {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #888;
  }
</style>
</head>
<body>

  <div class="scroll-stage">
    <div class="video-sticky">
      <video id="scrub-video" muted playsinline preload="auto">
        Dein Browser unterstützt das Video-Tag nicht.
      </video>
      <div class="info">Frame: <span id="frame-info">0</span> / <span id="duration-info">–</span>s</div>
    </div>
  </div>

  <div class="filler">Ende</div>

  <script>
    const video = document.getElementById('scrub-video');
    const stage = document.querySelector('.scroll-stage');
    const frameInfo = document.getElementById('frame-info');
    const durationInfo = document.getElementById('duration-info');

    let duration = 0;
    let ticking = false;

    // Breakpoint, ab dem die mobile Version geladen wird
    const isMobile = window.matchMedia('(max-width: 768px)').matches;

    // Passende Quelle(n) je nach Gerät einfügen
    if (isMobile) {
      video.insertAdjacentHTML('afterbegin', `
        <source src="2.webm" type="video/webm">
      `);
    } else {
      video.insertAdjacentHTML('afterbegin', `
        <source src="video1.mp4" type="video/mp4">
        <source src="1.mkv" type="video/x-matroska">
      `);
    }
    video.load();

    // Sobald die Metadaten (Länge etc.) geladen sind
    video.addEventListener('loadedmetadata', () => {
      duration = video.duration;
      durationInfo.textContent = duration.toFixed(2);
      // Sicherstellen, dass beim Laden bei Frame 0 pausiert wird
      video.currentTime = 0;
    });

    function updateVideoTime() {
      if (!duration) return;

      const stageRect = stage.getBoundingClientRect();
      const stageHeight = stage.offsetHeight - window.innerHeight;

      // Scroll-Fortschritt innerhalb des Stage-Containers, 0 bis 1
      let progress = -stageRect.top / stageHeight;
      progress = Math.min(Math.max(progress, 0), 1);

      video.currentTime = progress * duration;
      frameInfo.textContent = video.currentTime.toFixed(2);
      ticking = false;
    }

    // requestAnimationFrame sorgt für butterweiches Scrubbing ohne
    // den Scroll-Handler zu überlasten
    window.addEventListener('scroll', () => {
      if (!ticking) {
        window.requestAnimationFrame(updateVideoTime);
        ticking = true;
      }
    }, { passive: true });

    // Falls Metadaten schon vor Listener-Registrierung geladen waren
    if (video.readyState >= 1) {
      duration = video.duration;
      durationInfo.textContent = duration.toFixed(2);
    }
  </script>

</body>
</html>
