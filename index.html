<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scroll-Video Demo</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0b0b0b; font-family:sans-serif; color:#fff; }

  /* Der Bereich, über den man scrollen muss, damit das Video komplett abläuft.
     Höher = langsamer scrubbt das Video (mehr Scroll-Distanz pro Sekunde Video). */
  .scroll-stage {
    height: 400vh; /* <- hier die Scroll-Länge anpassen */
    position: relative;
  }

  /* Der Video-Bereich bleibt beim Scrollen fix im Bildschirm stehen */
  .sticky-wrap {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #000;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .progress-bar {
    position: fixed;
    top: 0; left: 0;
    height: 4px;
    background: #ffffff;
    z-index: 10;
  }

  .hint {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    font-size: 14px;
    opacity: 0.6;
    z-index: 10;
  }

  .spacer {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    opacity: 0.5;
  }

  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #fff;
    font-size: 16px;
    z-index: 20;
  }
</style>
</head>
<body>

<div class="loading" id="loading">Video wird geladen...</div>
<div class="progress-bar" id="progressBar"></div>
<div class="hint">Scrolle nach unten &darr; / nach oben &uarr;</div>

<div class="spacer">Nach unten scrollen, um das Video zu starten</div>

<div class="scroll-stage" id="scrollStage">
  <div class="sticky-wrap">
    <!-- WICHTIG: Dateiname muss zu deiner Datei im Repo passen -->
    <video id="video" src="1.mp4" muted playsinline preload="auto"></video>
  </div>
</div>

<div class="spacer">Ende der Sequenz</div>

<script>
/* ==========================================================================
   SCROLL-SCRUBBING mit direktem <video>-Element
   --------------------------------------------------------------------------
   Einfacher als die Frame-Bilder-Variante: nur EINE Videodatei nötig statt
   hunderter Einzelbilder. Beim Scrollen wird video.currentTime passend zur
   Scroll-Position gesetzt. Etwas weniger butterweich als echtes Frame-
   Scrubbing, dafür viel einfacher zu hosten (z.B. auf GitHub Pages).

   Voraussetzung: 1.mkv wurde vorher zu 1.mp4 konvertiert:

     ffmpeg -i 1.mkv -c:v libx264 -crf 23 -preset medium -movflags +faststart -an 1.mp4

   Die Datei 1.mp4 muss im selben Ordner wie diese index.html liegen und
   mit ins Repo gepusht werden.
   ========================================================================== */

const video = document.getElementById('video');
const scrollStage = document.getElementById('scrollStage');
const progressBar = document.getElementById('progressBar');
const loading = document.getElementById('loading');

let duration = 0;
let ticking = false;

video.addEventListener('loadedmetadata', () => {
  duration = video.duration;
  loading.remove();
  updateFrameFromScroll();
});

video.addEventListener('error', () => {
  loading.textContent = 'Video konnte nicht geladen werden. Prüfe, ob "1.mp4" im selben Ordner liegt und im Repo committed wurde.';
});

function onScroll() {
  if (!ticking) {
    requestAnimationFrame(updateFrameFromScroll);
    ticking = true;
  }
}

function updateFrameFromScroll() {
  if (!duration) { ticking = false; return; }

  const rect = scrollStage.getBoundingClientRect();
  const stageHeight = scrollStage.offsetHeight - window.innerHeight;
  let progress = -rect.top / stageHeight;
  progress = Math.max(0, Math.min(1, progress));

  // kleiner Sicherheitsabstand vom Videoende, sonst manchmal Ruckler am letzten Frame
  video.currentTime = progress * (duration - 0.05);

  progressBar.style.width = (progress * 100) + '%';
  ticking = false;
}

window.addEventListener('scroll', onScroll, { passive: true });
</script>

</body>
</html>
